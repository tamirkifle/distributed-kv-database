# Prometheus scrape config for the 5-node LedgerKV compose cluster.
# Each node serves /metrics off its health HTTP port (8080 inside the compose network).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ledgerkv
    metrics_path: /metrics
    static_configs:
      - targets:
          - node0:8080
          - node1:8080
          - node2:8080
          - node3:8080
          - node4:8080
