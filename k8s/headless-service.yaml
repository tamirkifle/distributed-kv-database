# Headless Service: gives every StatefulSet pod a stable DNS name
#   ledgerkv-<ordinal>.ledgerkv-headless.<namespace>.svc.cluster.local
# Peers are discovered by ordinal hostname (no cluster IP, DNS returns pod IPs).
# publishNotReadyAddresses lets peers resolve each other before readiness so the
# quorum cluster can form at startup (NodeMain dials every peer on boot).
apiVersion: v1
kind: Service
metadata:
  name: ledgerkv-headless
  labels:
    app: ledgerkv
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: ledgerkv
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: health
      port: 8080
      targetPort: 8080
