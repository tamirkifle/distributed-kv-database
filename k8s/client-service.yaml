# Client front-door Service (ClusterIP): in-cluster clients dial ledgerkv:9090 and land on
# any pod. Every node is a quorum coordinator (NodeServer.useCoordinator), so it fans the
# request across the key's replica set regardless of which pod received it — plain round-robin
# is correct and no session affinity is needed. (The headless Service is for peer-to-peer DNS;
# this one is for clients.)
apiVersion: v1
kind: Service
metadata:
  name: ledgerkv
  labels:
    app: ledgerkv
spec:
  type: ClusterIP
  selector:
    app: ledgerkv
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
