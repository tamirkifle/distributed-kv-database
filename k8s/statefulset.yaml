# StatefulSet: 5 LedgerKV nodes with stable ordinal identity (ledgerkv-0..ledgerkv-4),
# each backed by its own PersistentVolume for the LSM data dir (/data).
#
# Identity: StatefulSet env is identical across pods, but each pod's hostname carries its
# ordinal (ledgerkv-3 -> "3"). The command wrapper extracts it into LEDGERKV_NODE_INDEX,
# which NodeConfig requires and which maps the pod to the clusterId-node-<index> id and to
# its slot in the positional LEDGERKV_PEERS list. The wrapper then exec's the 2e image jar
# (the image is reused as-is; we override command only to inject the per-pod ordinal).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledgerkv
  labels:
    app: ledgerkv
spec:
  serviceName: ledgerkv-headless
  replicas: 5
  podManagementPolicy: Parallel  # peers dial each other at boot; start them together
  selector:
    matchLabels:
      app: ledgerkv
  template:
    metadata:
      labels:
        app: ledgerkv
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: ledgerkv
          image: ledgerkv:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export LEDGERKV_NODE_INDEX="${HOSTNAME##*-}"
              echo "deriving ordinal from $HOSTNAME -> index $LEDGERKV_NODE_INDEX"
              exec java -jar /app/ledgerkv.jar
          ports:
            - name: grpc
              containerPort: 9090
            - name: health
              containerPort: 8080
          env:
            - name: LEDGERKV_CLUSTER_ID
              value: "ledgerkv"
            - name: LEDGERKV_NODE_COUNT
              value: "5"
            - name: LEDGERKV_GRPC_PORT
              value: "9090"
            - name: LEDGERKV_HEALTH_PORT
              value: "8080"
            - name: LEDGERKV_DATA_DIR
              value: "/data"
            - name: LEDGERKV_REPLICATION_FACTOR
              value: "3"
            - name: LEDGERKV_WRITE_QUORUM
              value: "2"
            - name: LEDGERKV_READ_QUORUM
              value: "2"
            - name: LEDGERKV_PEERS
              value: "ledgerkv-0.ledgerkv-headless:9090,ledgerkv-1.ledgerkv-headless:9090,ledgerkv-2.ledgerkv-headless:9090,ledgerkv-3.ledgerkv-headless:9090,ledgerkv-4.ledgerkv-headless:9090"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
